name: medical-diagnostics

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install diagnostic dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy scikit-learn scikit-image pyyaml
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Compile source
        run: python -m compileall -q medical_experiments tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic diagnostic suite
        run: bash scripts/medical/run-smoke-suite.sh
